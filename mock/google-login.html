<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Google 로그인 테스트</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        max-width: 560px;
        margin: 48px auto;
        padding: 0 16px;
        line-height: 1.5;
      }
      h1 {
        margin-bottom: 8px;
      }
      .muted {
        color: #666;
        font-size: 14px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 12px 0;
      }
      input {
        flex: 1;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
      }
      button {
        padding: 10px 16px;
        border: 0;
        border-radius: 6px;
        background: #4285f4;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }
      button.secondary {
        background: #555;
      }
      pre {
        background: #111;
        color: #0f0;
        padding: 12px;
        border-radius: 6px;
        overflow: auto;
        font-size: 12px;
        max-height: 320px;
      }
    </style>
  </head>
  <body>
    <h1>Google 로그인 테스트</h1>
    <p class="muted">
      백엔드의 <code>/auth/google</code> 엔드포인트로 이동하여 Google OAuth 흐름을 테스트합니다.
    </p>

    <div class="row">
      <label for="base" class="muted" style="width: 80px">Base URL</label>
      <input id="base" value="http://localhost:3320/v1/aideep/api" />
    </div>

    <div class="row">
      <button id="login">Google 로그인 시작</button>
      <button id="copy" class="secondary" type="button">결과 복사</button>
    </div>

    <h3>콜백 응답</h3>
    <pre id="out">아직 응답 없음</pre>

    <script>
      const baseInput = document.getElementById('base');
      const out = document.getElementById('out');

      const stored = localStorage.getItem('aideep.base');
      if (stored) baseInput.value = stored;
      baseInput.addEventListener('change', () => {
        localStorage.setItem('aideep.base', baseInput.value.trim());
      });

      document.getElementById('login').addEventListener('click', () => {
        const base = baseInput.value.trim().replace(/\/$/, '');
        localStorage.setItem('aideep.base', base);
        window.location.href = `${base}/auth/google`;
      });

      document.getElementById('copy').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(out.textContent || '');
          alert('복사됨');
        } catch (e) {
          alert('복사 실패: ' + e.message);
        }
      });

      // 콜백이 JSON을 그대로 반환하는 경우 — 이 페이지로 돌아오지 않으므로,
      // 별도로 콜백 결과를 보고 싶을 때는 백엔드 JSON 페이지에서 토큰을 복사해
      // 아래 검증용 호출에 사용하세요.
      // 만약 fetch 모드로 시도하려면 아래 함수를 콘솔에서 호출:
      window.verifyToken = async (accessToken) => {
        const base = baseInput.value.trim().replace(/\/$/, '');
        const res = await fetch(`${base}/user`, {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        const json = await res.json().catch(() => ({}));
        out.textContent = JSON.stringify(json, null, 2);
      };
    </script>
  </body>
</html>
